<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #e7e9ea;
      padding: 20px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #1d9bf0;
      text-align: center;
    }
    .subtitle {
      font-size: 11px;
      color: #6e767d;
      text-align: center;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #8b98a5;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: #1e2e3d;
      border: 1px solid #38444d;
      border-radius: 8px;
      color: #e7e9ea;
      font-size: 15px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: #1d9bf0;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      background: #1e2e3d;
      border: 1px solid #38444d;
      border-radius: 8px;
      color: #e7e9ea;
      font-size: 15px;
      outline: none;
      appearance: auto;
    }
    select:focus {
      border-color: #1d9bf0;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #startBtn {
      background: #1d9bf0;
      color: #fff;
      margin-bottom: 8px;
    }
    #stopBtn {
      background: #67070f;
      color: #fff;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      background: #1e2e3d;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status.running { border-left: 3px solid #1d9bf0; }
    .status.done { border-left: 3px solid #00ba7c; }
    .status.stopped { border-left: 3px solid #f4212e; }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .field {
      flex: 1;
    }
    .warning {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(244,33,46,0.08);
      border: 1px solid rgba(244,33,46,0.2);
      border-radius: 8px;
      font-size: 11px;
      color: #f4212e;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>X Media Downloader</h1>
  <p class="subtitle">Download videos & photos from X/Twitter</p>

  <div class="field">
    <label>Max Items to Download</label>
    <input type="number" id="maxMedia" min="1" max="10000" value="100">
  </div>

  <div class="row">
    <div class="field">
      <label>Media Type</label>
      <select id="mediaFilter">
        <option value="all" selected>All (video + photo)</option>
        <option value="video">Videos only</option>
        <option value="photo">Photos only</option>
      </select>
    </div>
    <div class="field">
      <label>Scroll Speed</label>
      <select id="scrollSpeed">
        <option value="slow">Slow (safer)</option>
        <option value="medium" selected>Medium</option>
        <option value="fast">Fast</option>
      </select>
    </div>
  </div>

  <button class="btn" id="startBtn">Start Downloading</button>
  <button class="btn" id="stopBtn">Stop</button>

  <div class="status" id="status">Navigate to X and press Start</div>

  <div class="warning" id="warning" style="display:none;"></div>

  <script src="popup.js"></script>
</body>
</html>
