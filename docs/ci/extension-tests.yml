name: extension-tests

# Offline verification only. GitHub-hosted runners CANNOT run real-browser
# MV3 extension tests (Chrome DevTools Runtime.enable timeouts / Brave
# SIGTRAP — 100% failure rate where tried in the sister repo nh-dw-2.0), so
# this workflow sticks to what is reliable headless: syntax checks, the
# fixture/unit suites, and the window-less VM download-pipeline suites.
# Real-browser verification stays a local manual step — see
# docs/SESSION_HANDOFF.md §5.

permissions:
  contents: read

concurrency:
  group: extension-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'extension/**'
      - 'firefox-extension/**'
      - 'source/archive-enabled/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/extension-tests.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'firefox-extension/**'
      - 'source/archive-enabled/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/extension-tests.yml'

jobs:
  offline:
    name: Offline suites (syntax + fixtures + window-less VM pipelines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v5+ runs on the node24 runtime; v4 was node20, which runner images now
      # deprecate by forcing it onto node24 with a warning.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check every shipped script
        run: |
          shopt -s nullglob
          files=(extension/*.js extension/lib/*.js)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            node --check "$f"
          done
      - name: Unit + pipeline suites (node --test)
        run: node --test tests/*.test.js
      - name: Release zip packages cleanly
        run: |
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y zip
          scripts/package-release.sh ci
          # Glob-safe: `test -f releases/*.zip` breaks ("binary operator
          # expected") the moment a second zip exists in the folder.
          shopt -s nullglob
          zips=(releases/x-media-downloader-v*.zip)
          test "${#zips[@]}" -gt 0
