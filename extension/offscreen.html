<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>X Media Downloader — GIF conversion</title>
</head>
<body>
  <!-- Offscreen document: converts X's silent MP4 "GIF" clips into real
       animated .gif files (canvas + the streaming GIF89a encoder). It exists
       because MV3 service workers have no <video> or canvas. Only
       chrome.runtime is available here — chrome.storage / chrome.downloads
       calls would crash the document. -->
  <script src="lib/gifEncoder.js"></script>
  <script src="offscreen.js"></script>
</body>
</html>
